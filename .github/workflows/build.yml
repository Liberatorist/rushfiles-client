name: Build

# Every push and pull request runs the tests and builds tarballs, kept as workflow
# artifacts. Pushing a v* tag also publishes them on the GitHub release page.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: go vet .
      - run: go test .

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Package
        run: |
          name="rushfiles-${GITHUB_REF_NAME//\//-}-linux-$GOARCH"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags='-s -w' -o "dist/$name/rushfiles" .
          cp README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: rushfiles-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.tar.gz > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
